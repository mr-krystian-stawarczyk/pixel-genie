<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Pixel-Genie Formularregistrierung</title></head>
<body>
<!-- Build-time registration for the JavaScript contact modal. This form is not customer-facing. -->
<form name="pixel-genie-contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="pixel-genie-contact">
  <input name="lead_reference" type="text">
  <input name="source" type="text">
  <input name="traffic_source" type="text">
  <input name="traffic_medium" type="text">
  <input name="traffic_campaign" type="text">
  <input name="referrer_host" type="text">
  <input name="landing_path" type="text">
  <input name="topic" type="text">
  <input name="name" type="text">
  <input name="email" type="email">
  <input name="phone" type="text">
  <textarea name="message"></textarea>
  <input name="budget" type="text">
  <input name="accepted" type="text">
  <input name="website" type="text">
</form>
</body>
</html>
